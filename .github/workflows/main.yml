name: Main
on:
  push:
    branches:
    - main
  pull_request: ~

jobs:
  build:
    name: Build, lint, and test on Node ${{ matrix.node }} and ${{ matrix.os }}

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node: ['18.x']
        os: [ubuntu-latest, windows-latest, macOS-latest]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Use Node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Install deps
        run: yarn

      - name: Lint
        run: yarn lint

      - name: Unit tests
        run: yarn test:unit --ci --coverage

  integration:
    name: Integration tests

    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Use Node 18.x
        uses: actions/setup-node@v7
        with:
          node-version: '18.x'

      - name: Install deps
        run: yarn

      - name: Print resolved image digests
        run: |
          docker compose -f test/integration/util/docker-compose.yml pull -q
          docker compose -f test/integration/util/docker-compose.yml images

      - name: Start docker stack (voconed, blind-csp, vocfaucet)
        run: scripts/integration-stack.sh up # appends API_URL & friends to GITHUB_ENV

      - name: Integration tests
        run: yarn test:integration --ci --coverage --maxWorkers=2

      - name: Service tests
        run: yarn test:service --ci --coverage --maxWorkers=2

      - name: API tests
        run: yarn test:api --ci --coverage --maxWorkers=2

      - name: Anonymous integration tests
        run: yarn test:integration:zk --ci --coverage

      - name: Debug docker logs in case of failure
        if: failure()
        run: scripts/integration-stack.sh logs

      - name: Stop and cleanup docker containers
        if: always()
        run: scripts/integration-stack.sh down
