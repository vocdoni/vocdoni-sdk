name: vocdoni-sdk-integration

x-common: &common
  env_file: .env # the container env will inherit all vars defined in this file
  sysctls:
    net.core.somaxconn: 8128
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "10"

# TODO: all of these services should really implement viper to read all flags from environment
# but they do not (yet), so we need to pass them as cmdline args

services:
  voconed:
    image: "vocdoni/vocdoni-node:main"
    entrypoint: "/app/voconed"
    command: |
      --setTxCosts --txCosts ${VOCONED_TXCOSTS}
      --fundedAccounts ${FAUCET_ACCOUNT}:${FAUCET_ACCOUNT_FUNDS}
    # voconed will fund FAUCET_ACCOUNT so that faucet packages signed by vocfaucet actually work
    ports:
      - "127.0.0.1:${VOCONED_HOST_PORT:-9095}:${VOCONED_PORT}"
    volumes:
      # Caches the zk circuit artifacts downloaded on first boot, so repeated
      # local `up` cycles skip the download entirely. `down -v` drops it.
      - voconed_run:/app/run
    restart: on-failure
    healthcheck:
      # The generous window exists because voconed's first boot downloads the zk
      # circuit artifacts, and its own deadline on that download is 300s: a
      # shorter window cannot survive even one slow-but-recoverable fetch.
      test: ['CMD', 'curl', '-sf', 'http://localhost:${VOCONED_PORT}${VOCONED_URLPATH}/chain/info']
      interval: 3s
      retries: 120
      start_period: 60s
    <<: *common

  blind-csp:
    image: "vocdoni/blind-csp:master"
    command: |
      --key ${BLINDCSP_PRIVKEY}
    ports:
      - "127.0.0.1:${BLINDCSP_HOST_PORT:-5000}:${BLINDCSP_PORT}"
    <<: *common

  vocfaucet:
    image: "ghcr.io/vocdoni/vocfaucet:main"
    command: |
      --amounts=${FAUCET_AMOUNTS}
      --listenPort=${FAUCET_LISTENPORT}
      --logLevel=${FAUCET_LOGLEVEL}
      --dataDir=${FAUCET_DATADIR}
      --waitPeriod=${FAUCET_WAITPERIOD}
      --dbType=${FAUCET_DBTYPE}
      --baseRoute=${FAUCET_BASEROUTE}
      --auth=${FAUCET_AUTH}
      --privKey=${FAUCET_PRIVKEY}
    ports:
      - "127.0.0.1:${VOCFAUCET_HOST_PORT:-8085}:${FAUCET_LISTENPORT}"
    <<: *common

volumes:
  voconed_run:
